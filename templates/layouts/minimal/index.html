<!doctype html>
<html lang="en" class="gc-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ScholarTap</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/qrcode.js" defer></script>
  <script src="js/card.js" defer></script>
</head>
<body>
  <!-- TEMPLATE: Minimal — link-in-bio style, fast and clean. Edit card.json, not this file. -->
  <main class="col">
    <div class="avatar">
      <img data-src="photo" alt="">
      <span class="initials" data-initials hidden></span>
    </div>
    <h1 data-field="name"></h1>
    <p class="sub"><span data-field="title"></span></p>
    <p class="sub faint" data-join=" · " data-fields="organization,pronouns"></p>
    <p class="tag" data-show="gsaRole"><i></i><span data-field="gsaRole"></span></p>

    <div class="row">
      <a class="pill dark" href="#" data-action="save-contact"><span data-icon="contact"></span>Save contact</a>
      <a class="pill" href="#" data-action="share" aria-label="Share"><span data-icon="share"></span></a>
      <a class="pill" href="#" data-action="toggle" data-target=".qr-sheet" aria-label="Show QR code"><span data-icon="qr"></span></a>
    </div>

    <div class="qr-sheet">
      <div class="qr" data-qr></div>
      <p data-card-url></p>
    </div>

    <nav class="stack">
      <a class="item" data-href="cv" target="_blank"><span data-icon="cv"></span>Curriculum Vitae<em>PDF</em></a>
      <a class="item" data-href="email" data-prefix="mailto:"><span data-icon="email"></span>Email me</a>
      <a class="item" data-href="calendar"><span data-icon="calendar"></span>Book a coffee chat</a>
      <a class="item" data-href="website"><span data-icon="website"></span>Website</a>
      <div class="contents" data-list="links">
        <template><a class="item" data-item-href="url"><span data-item-icon="icon"></span><span data-item="label"></span></a></template>
      </div>
    </nav>

    <section class="note" data-section="researchInterests">
      <p class="label">Working on</p>
      <p class="interests" data-list="researchInterests"><template><span data-item="."></span></template></p>
    </section>

    <div class="wallet" data-wallet-group hidden>
      <a class="wbtn" data-wallet="apple" hidden><span data-icon="apple"></span><span><small>Add to</small>Apple Wallet</span></a>
      <a class="wbtn" data-wallet="google" hidden><span data-icon="wallet"></span><span><small>Save to</small>Google Wallet</span></a>
      <a class="wbtn" data-wallet="samsung" hidden><span data-icon="wallet"></span><span><small>Add to</small>Samsung Wallet</span></a>
    </div>

    <footer>
      <span data-field="brand.org"></span>
      <a class="powered" data-powered>Made with <strong>ScholarTap</strong></a>
    </footer>
  </main>
</body>
</html>
