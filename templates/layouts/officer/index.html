<!doctype html>
<html lang="en" class="gc-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GSA Connect</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/qrcode.js" defer></script>
  <script src="js/card.js" defer></script>
</head>
<body>
  <!-- TEMPLATE: Officer — ID-badge layout for GSA officers, senators & org leads. Edit card.json, not this file. -->
  <main class="wrap">
    <article class="badge">
      <div class="slot" aria-hidden="true"></div>
      <header class="badge-head">
        <span data-field="brand.org"></span>
        <span class="tagline" data-field="badgeLabel"></span>
      </header>
      <div class="badge-body">
        <div class="photo">
          <img data-src="photo" alt="">
          <span class="initials" data-initials hidden></span>
        </div>
        <h1 data-field="name"></h1>
        <p class="pron" data-field="pronouns"></p>
        <p class="office" data-field="gsaRole"></p>
        <p class="meta"><span data-field="title"></span></p>
        <p class="meta dim" data-field="department"></p>
      </div>
      <div class="badge-strip">
        <div class="qr" data-qr></div>
        <div class="strip-text">
          <span class="lbl">Scan · Tap · Connect</span>
          <span class="url" data-card-url></span>
        </div>
      </div>
    </article>

    <div class="cta-row">
      <a class="cta red" href="#" data-action="save-contact"><span data-icon="contact"></span>Save contact</a>
      <a class="cta" data-href="calendar"><span data-icon="calendar"></span>Book a meeting</a>
      <a class="cta" data-href="email" data-prefix="mailto:"><span data-icon="email"></span>Email</a>
      <a class="cta" href="#" data-action="share"><span data-icon="share"></span>Share</a>
    </div>

    <section class="box hours" data-section="officeHours">
      <h2>Office hours</h2>
      <p data-field="officeHours"></p>
    </section>

    <section class="box" data-section="events">
      <h2>Upcoming</h2>
      <ul class="events" data-list="events">
        <template>
          <li><a data-item-href="url">
            <span class="date" data-item="date"></span>
            <span class="ev"><strong data-item="title"></strong><span data-item="where"></span></span>
          </a></li>
        </template>
      </ul>
    </section>

    <section class="box" data-section="bio">
      <h2>About me</h2>
      <p data-field="bio"></p>
      <ul class="chips" data-list="researchInterests"><template><li data-item="."></li></template></ul>
    </section>

    <section class="box" data-section="links">
      <h2>Links</h2>
      <div class="links">
        <a class="lnk" data-href="cv" target="_blank"><span data-icon="cv"></span>CV (PDF)</a>
        <span class="contents" data-list="links"><template><a class="lnk" data-item-href="url"><span data-item-icon="icon"></span><span data-item="label"></span></a></template></span>
      </div>
    </section>

    <section class="wallet-box" data-wallet-group hidden>
      <div class="wallet">
        <a class="wbtn" data-wallet="apple" hidden><span data-icon="apple"></span><span><small>Add to</small>Apple Wallet</span></a>
        <a class="wbtn" data-wallet="google" hidden><span data-icon="wallet"></span><span><small>Save to</small>Google Wallet</span></a>
        <a class="wbtn" data-wallet="samsung" hidden><span data-icon="wallet"></span><span><small>Add to</small>Samsung Wallet</span></a>
      </div>
    </section>

    <footer><a class="powered" data-powered>Powered by <strong>ScholarTap</strong></a></footer>
  </main>
</body>
</html>
