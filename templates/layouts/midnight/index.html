<!doctype html>
<html lang="en" class="gc-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GSA Connect</title>
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/qrcode.js" defer></script>
  <script src="js/card.js" defer></script>
</head>
<body>
  <!-- TEMPLATE: Midnight — dark mode with a flippable physical card. Edit card.json, not this file. -->
  <main class="shell">
    <div class="scene" data-flippable>
      <button class="card" data-action="flip" aria-label="Flip card to show QR code">
        <span class="face front">
          <span class="top">
            <span class="brand"><span data-field="brand.orgShort"></span><b>Connect</b></span>
            <span class="nfc" data-icon="wifi-nfc"></span>
          </span>
          <span class="who">
            <span class="name" data-field="name"></span>
            <span class="role" data-field="title"></span>
          </span>
          <span class="bottom">
            <span class="mono" data-field="gsaRole"></span>
            <span class="hint">tap to flip ↻</span>
          </span>
        </span>
        <span class="face back">
          <span class="qr" data-qr></span>
          <span class="back-meta">
            <span class="mono small">scan to connect</span>
            <span class="mono url" data-card-url></span>
          </span>
        </span>
      </button>
    </div>

    <p class="headline" data-field="headline"></p>

    <div class="grid-actions">
      <a class="glass act" href="#" data-action="save-contact"><span data-icon="contact"></span><span>Save</span></a>
      <a class="glass act" data-href="email" data-prefix="mailto:"><span data-icon="email"></span><span>Email</span></a>
      <a class="glass act" data-href="phone" data-prefix="tel:"><span data-icon="phone"></span><span>Call</span></a>
      <a class="glass act" href="#" data-action="share"><span data-icon="share"></span><span>Share</span></a>
    </div>

    <a class="glass cv" data-href="cv" target="_blank">
      <span class="mono small">curriculum_vitae.pdf</span>
      <strong>Read my CV</strong>
      <span class="go" data-icon="arrow"></span>
    </a>

    <section class="glass block" data-section="researchInterests">
      <h2 class="mono small">// research</h2>
      <ul class="tags" data-list="researchInterests"><template><li data-item="."></li></template></ul>
    </section>

    <section class="glass block" data-section="projects">
      <h2 class="mono small">// projects</h2>
      <div class="rows" data-list="projects">
        <template><a class="rowlink" data-item-href="url"><strong data-item="title"></strong><span data-item="description"></span></a></template>
      </div>
    </section>

    <section class="glass block" data-section="publications">
      <h2 class="mono small">// publications</h2>
      <div class="rows" data-list="publications">
        <template><a class="rowlink" data-item-href="url"><strong data-item="title"></strong><span><span data-item="venue"></span> — <span data-item="year"></span></span></a></template>
      </div>
    </section>

    <section class="links" data-list="links">
      <template><a class="glass link" data-item-href="url"><span data-item-icon="icon"></span><span data-item="label"></span></a></template>
    </section>

    <section class="wallet-block" data-wallet-group hidden>
      <h2 class="mono small">// add to wallet</h2>
      <div class="wallet">
        <a class="wbtn" data-wallet="apple" hidden><span data-icon="apple"></span><span><small>Add to</small>Apple Wallet</span></a>
        <a class="wbtn" data-wallet="google" hidden><span data-icon="wallet"></span><span><small>Save to</small>Google Wallet</span></a>
        <a class="wbtn" data-wallet="samsung" hidden><span data-icon="wallet"></span><span><small>Add to</small>Samsung Wallet</span></a>
      </div>
    </section>

    <footer>
      <span class="mono small" data-field="brand.org"></span>
      <a class="powered" data-powered>Powered by <strong>ScholarTap</strong></a>
    </footer>
  </main>
</body>
</html>
