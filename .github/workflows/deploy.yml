name: Build & deploy card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm install --no-audit --no-fund

      - name: Build card, vCard, QR and wallet passes
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Apple Wallet (optional)
          APPLE_PASS_TYPE_ID: ${{ secrets.APPLE_PASS_TYPE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNER_CERT: ${{ secrets.APPLE_SIGNER_CERT }}
          APPLE_SIGNER_KEY: ${{ secrets.APPLE_SIGNER_KEY }}
          APPLE_SIGNER_KEY_PASSPHRASE: ${{ secrets.APPLE_SIGNER_KEY_PASSPHRASE }}
          APPLE_WWDR_CERT: ${{ secrets.APPLE_WWDR_CERT }}
          # Google Wallet (optional)
          GOOGLE_WALLET_ISSUER_ID: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GOOGLE_WALLET_SA_KEY: ${{ secrets.GOOGLE_WALLET_SA_KEY }}
          # Samsung Wallet (optional)
          SAMSUNG_PARTNER_ID: ${{ secrets.SAMSUNG_PARTNER_ID }}
          SAMSUNG_CARD_ID: ${{ secrets.SAMSUNG_CARD_ID }}
          SAMSUNG_CERTIFICATE_ID: ${{ secrets.SAMSUNG_CERTIFICATE_ID }}
          SAMSUNG_PARTNER_PRIVATE_KEY: ${{ secrets.SAMSUNG_PARTNER_PRIVATE_KEY }}
          SAMSUNG_PUBLIC_CERT: ${{ secrets.SAMSUNG_PUBLIC_CERT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
